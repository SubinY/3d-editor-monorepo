<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反射与光源关系演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: #1a1a2e;
      color: #fff;
      overflow: hidden;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      gap: 2px;
      background: #000;
    }
    .demo-panel {
      position: relative;
      background: #1a1a2e;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 8px 15px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      z-index: 10;
    }
    .controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      border-radius: 8px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 90%;
      z-index: 10;
    }
    button {
      padding: 6px 12px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.3s;
    }
    button:hover {
      background: #357abd;
    }
    button.active {
      background: #2ecc71;
    }
    .info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      max-width: 250px;
      font-size: 11px;
      line-height: 1.5;
      z-index: 10;
    }
    .info h4 {
      margin-bottom: 5px;
      color: #4a90e2;
      font-size: 12px;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }
    .slider-container label {
      font-size: 11px;
      min-width: 80px;
    }
    input[type="range"] {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左上：正常光源 + 反射 -->
    <div class="demo-panel">
      <div class="label">✅ 正常光源 + 反射</div>
      <canvas id="canvas-normal"></canvas>
      <div class="info">
        <h4>正常设置：</h4>
        <div>方向光：白色，强度 1.0</div>
        <div>环境光：白色，强度 0.4</div>
        <div>反射：清晰可见</div>
      </div>
    </div>

    <!-- 右上：强光源 + 反射 -->
    <div class="demo-panel">
      <div class="label">💡 强光源 + 反射</div>
      <canvas id="canvas-bright"></canvas>
      <div class="info">
        <h4>强光源：</h4>
        <div>方向光：白色，强度 2.0</div>
        <div>环境光：白色，强度 0.8</div>
        <div>反射：更亮更清晰</div>
      </div>
    </div>

    <!-- 左下：弱光源 + 反射 -->
    <div class="demo-panel">
      <div class="label">🌙 弱光源 + 反射</div>
      <canvas id="canvas-dim"></canvas>
      <div class="info">
        <h4>弱光源：</h4>
        <div>方向光：白色，强度 0.3</div>
        <div>环境光：白色，强度 0.1</div>
        <div>反射：较暗较模糊</div>
      </div>
    </div>

    <!-- 右下：彩色光源 + 反射 -->
    <div class="demo-panel">
      <div class="label">🌈 彩色光源 + 反射</div>
      <canvas id="canvas-colored"></canvas>
      <div class="info">
        <h4>彩色光源：</h4>
        <div>方向光：橙色，强度 1.0</div>
        <div>环境光：蓝色，强度 0.4</div>
        <div>反射：带有光源颜色</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="toggleAnimation()">暂停/播放</button>
    <button onclick="resetPosition()">重置</button>
    <div class="slider-container">
      <label>光源强度:</label>
      <input type="range" id="intensitySlider" min="0" max="3" step="0.1" value="1" 
             oninput="updateIntensity(this.value)">
      <span id="intensityValue">1.0</span>
    </div>
    <div style="margin-left: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <label style="font-size: 11px;">光源位置:</label>
      <button onclick="setLightPosition('top')">上方</button>
      <button onclick="setLightPosition('left')">左侧</button>
      <button onclick="setLightPosition('right')">右侧</button>
      <button onclick="setLightPosition('front')">前方</button>
      <button onclick="setLightPosition('back')">后方</button>
      <button onclick="setLightPosition('diagonal')">斜角</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three'
    import { Reflector } from 'three/addons/objects/Reflector.js'

    let animationId = null
    let isAnimating = true
    let currentIntensity = 1.0

    // 创建场景的通用函数
    function createScene(canvasId, lightConfig) {
      const canvas = document.getElementById(canvasId)
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x1a1a2e)

      // 相机
      const camera = new THREE.PerspectiveCamera(
        50,
        canvas.clientWidth / canvas.clientHeight,
        0.1,
        1000
      )
      camera.position.set(8, 6, 8)
      camera.lookAt(0, 0, 0)

      // 渲染器
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
      renderer.setSize(canvas.clientWidth, canvas.clientHeight)
      renderer.shadowMap.enabled = true
      renderer.shadowMap.type = THREE.PCFSoftShadowMap

      // 方向光
      const directionalLight = new THREE.DirectionalLight(
        lightConfig.dirColor || 0xffffff,
        lightConfig.dirIntensity || 1.0
      )
      directionalLight.position.set(5, 10, 5)
      directionalLight.castShadow = true
      
      // 设置光源目标（指向场景中心）
      const lightTarget = new THREE.Object3D()
      lightTarget.position.set(0, 0, 0)
      directionalLight.target = lightTarget
      scene.add(lightTarget)
      
      // 光源辅助器（可视化光源位置和方向）
      const lightHelper = new THREE.DirectionalLightHelper(directionalLight, 2)
      lightHelper.visible = true
      scene.add(lightHelper)
      directionalLight.shadow.mapSize.width = 1024
      directionalLight.shadow.mapSize.height = 1024
      directionalLight.shadow.camera.near = 0.5
      directionalLight.shadow.camera.far = 50
      directionalLight.shadow.camera.left = -10
      directionalLight.shadow.camera.right = 10
      directionalLight.shadow.camera.top = 10
      directionalLight.shadow.camera.bottom = -10
      scene.add(directionalLight)

      // 环境光
      const ambientLight = new THREE.AmbientLight(
        lightConfig.ambientColor || 0xffffff,
        lightConfig.ambientIntensity || 0.4
      )
      scene.add(ambientLight)

      // 创建反射地板
      const floorGeometry = new THREE.PlaneGeometry(20, 20)
      const reflector = new Reflector(floorGeometry, {
        color: 0x52c5ff,
        textureWidth: 1024,
        textureHeight: 1024,
        clipBias: 0.0005,
        multisample: 4
      })
      reflector.rotation.x = -Math.PI / 2
      reflector.position.y = 0
      reflector.receiveShadow = true
      scene.add(reflector)

      // 创建测试物体
      const objects = []

      // 立方体
      const boxGeometry = new THREE.BoxGeometry(1, 1, 1)
      const boxMaterial = new THREE.MeshStandardMaterial({ color: 0xff6b6b })
      const box = new THREE.Mesh(boxGeometry, boxMaterial)
      box.position.set(-3, 0.5, -2)
      box.castShadow = true
      box.receiveShadow = true
      scene.add(box)
      objects.push(box)

      // 球体
      const sphereGeometry = new THREE.SphereGeometry(0.8, 32, 32)
      const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0x4ecdc4 })
      const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial)
      sphere.position.set(0, 0.8, 0)
      sphere.castShadow = true
      sphere.receiveShadow = true
      scene.add(sphere)
      objects.push(sphere)

      // 圆柱体
      const cylinderGeometry = new THREE.CylinderGeometry(0.6, 0.6, 1.5, 32)
      const cylinderMaterial = new THREE.MeshStandardMaterial({ color: 0xffe66d })
      const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial)
      cylinder.position.set(3, 0.75, 2)
      cylinder.castShadow = true
      cylinder.receiveShadow = true
      scene.add(cylinder)
      objects.push(cylinder)

      // 添加网格辅助线
      const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222)
      scene.add(gridHelper)

      return { scene, camera, renderer, objects, directionalLight, ambientLight, lightHelper, lightTarget }
    }

    // 创建四个场景
    const scene1 = createScene('canvas-normal', {
      dirColor: 0xffffff,
      dirIntensity: 1.0,
      ambientColor: 0xffffff,
      ambientIntensity: 0.4
    })

    const scene2 = createScene('canvas-bright', {
      dirColor: 0xffffff,
      dirIntensity: 2.0,
      ambientColor: 0xffffff,
      ambientIntensity: 0.8
    })

    const scene3 = createScene('canvas-dim', {
      dirColor: 0xffffff,
      dirIntensity: 0.3,
      ambientColor: 0xffffff,
      ambientIntensity: 0.1
    })

    const scene4 = createScene('canvas-colored', {
      dirColor: 0xff8800,  // 橙色
      dirIntensity: 1.0,
      ambientColor: 0x4488ff,  // 蓝色
      ambientIntensity: 0.4
    })

    const scenes = [scene1, scene2, scene3, scene4]

    // 动画函数
    function animate() {
      if (!isAnimating) return

      const time = Date.now() * 0.001

      scenes.forEach(scene => {
        scene.objects.forEach((obj, index) => {
          obj.rotation.y = time * 0.5 + index * 0.5
          obj.position.y = 0.5 + Math.sin(time * 2 + index) * 0.3
        })
        scene.renderer.render(scene.scene, scene.camera)
      })

      animationId = requestAnimationFrame(animate)
    }

    // 窗口大小调整
    function handleResize() {
      const width = window.innerWidth / 2
      const height = window.innerHeight / 2

      scenes.forEach(scene => {
        scene.camera.aspect = width / height
        scene.camera.updateProjectionMatrix()
        scene.renderer.setSize(width, height)
      })
    }

    window.addEventListener('resize', handleResize)

    // 控制函数
    window.toggleAnimation = function() {
      isAnimating = !isAnimating
      if (isAnimating) {
        animate()
      }
    }

    window.resetPosition = function() {
      scenes.forEach(scene => {
        scene.objects.forEach((obj, index) => {
          obj.rotation.y = index * 0.5
          obj.position.y = 0.5
        })
      })
    }

    window.updateIntensity = function(value) {
      currentIntensity = parseFloat(value)
      document.getElementById('intensityValue').textContent = currentIntensity.toFixed(1)
      
      // 更新所有场景的光源强度
      scenes.forEach(scene => {
        scene.directionalLight.intensity = currentIntensity
        scene.ambientLight.intensity = currentIntensity * 0.4
      })
    }
    
    // 光源位置预设
    const lightPositions = {
      top: [0, 15, 0],           // 正上方
      left: [-10, 10, 0],        // 左侧
      right: [10, 10, 0],        // 右侧
      front: [0, 10, 10],        // 前方
      back: [0, 10, -10],        // 后方
      diagonal: [8, 10, 8]       // 斜角（默认）
    }
    
    // 设置光源位置
    window.setLightPosition = function(positionName) {
      const pos = lightPositions[positionName] || lightPositions.diagonal
      
      // 更新所有场景的光源位置
      scenes.forEach(scene => {
        scene.directionalLight.position.set(pos[0], pos[1], pos[2])
        
        // 更新光源目标
        scene.lightTarget.position.set(0, 0, 0)
        scene.lightTarget.updateMatrixWorld()
        
        // 更新光源辅助器
        scene.lightHelper.update()
      })
    }

    // 开始动画
    animate()
  </script>
</body>
</html>
