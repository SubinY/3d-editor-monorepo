<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阴影效果演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: #1a1a2e;
      color: #fff;
      overflow: hidden;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .demo-panel {
      flex: 1;
      position: relative;
      border-right: 2px solid #333;
    }
    .demo-panel:last-child {
      border-right: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .label {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 30px;
      border-radius: 10px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    button {
      padding: 8px 16px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    button:hover {
      background: #357abd;
    }
    .info {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 5px;
      max-width: 300px;
      font-size: 12px;
      line-height: 1.6;
    }
    .info h3 {
      margin-bottom: 10px;
      color: #4a90e2;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左侧：无阴影场景 -->
    <div class="demo-panel">
      <div class="label">❌ 无阴影场景</div>
      <canvas id="canvas-no-shadow"></canvas>
      <div class="info">
        <h3>无阴影的问题：</h3>
        <ul>
          <li>物体看起来"漂浮"在空中</li>
          <li>缺乏空间感和深度感</li>
          <li>难以判断物体与地面的关系</li>
          <li>看起来不真实</li>
        </ul>
      </div>
    </div>

    <!-- 右侧：有阴影场景 -->
    <div class="demo-panel">
      <div class="label">✅ 有阴影场景</div>
      <canvas id="canvas-with-shadow"></canvas>
      <div class="info">
        <h3>阴影的作用：</h3>
        <ul>
          <li>物体"贴"在地面上</li>
          <li>增强空间感和深度感</li>
          <li>明确物体与地面的关系</li>
          <li>看起来更真实自然</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="toggleAnimation()">暂停/播放动画</button>
    <button onclick="resetPosition()">重置位置</button>
    <div style="margin-left: 20px; display: flex; gap: 10px; align-items: center;">
      <label style="font-size: 12px;">光源位置:</label>
      <button onclick="setLightPosition('top')">上方</button>
      <button onclick="setLightPosition('left')">左侧</button>
      <button onclick="setLightPosition('right')">右侧</button>
      <button onclick="setLightPosition('front')">前方</button>
      <button onclick="setLightPosition('back')">后方</button>
      <button onclick="setLightPosition('diagonal')">斜角</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three'

    let animationId = null
    let isAnimating = true

    // 创建场景的通用函数
    function createScene(canvasId, enableShadow) {
      const canvas = document.getElementById(canvasId)
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x1a1a2e)

      // 相机
      const camera = new THREE.PerspectiveCamera(
        50,
        canvas.clientWidth / canvas.clientHeight,
        0.1,
        1000
      )
      camera.position.set(8, 6, 8)
      camera.lookAt(0, 0, 0)

      // 渲染器
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
      renderer.setSize(canvas.clientWidth, canvas.clientHeight)
      renderer.shadowMap.enabled = enableShadow
      renderer.shadowMap.type = THREE.PCFSoftShadowMap

      // 地面
      const floorGeometry = new THREE.PlaneGeometry(20, 20)
      const floorMaterial = new THREE.MeshStandardMaterial({
        color: 0x2a2a4a,
        roughness: 0.8,
        metalness: 0.1
      })
      const floor = new THREE.Mesh(floorGeometry, floorMaterial)
      floor.rotation.x = -Math.PI / 2
      floor.position.y = 0
      floor.receiveShadow = enableShadow  // 关键：是否接收阴影
      scene.add(floor)

      // 方向光
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1)
      directionalLight.position.set(5, 10, 5)
      directionalLight.castShadow = enableShadow  // 关键：是否投射阴影
      
      // 设置光源目标（指向场景中心）
      const lightTarget = new THREE.Object3D()
      lightTarget.position.set(0, 0, 0)
      directionalLight.target = lightTarget
      scene.add(lightTarget)
      
      // 光源辅助器（可视化光源位置和方向）
      const lightHelper = new THREE.DirectionalLightHelper(directionalLight, 2)
      lightHelper.visible = true
      scene.add(lightHelper)
      if (enableShadow) {
        directionalLight.shadow.mapSize.width = 2048
        directionalLight.shadow.mapSize.height = 2048
        directionalLight.shadow.camera.near = 0.5
        directionalLight.shadow.camera.far = 50
        directionalLight.shadow.camera.left = -10
        directionalLight.shadow.camera.right = 10
        directionalLight.shadow.camera.top = 10
        directionalLight.shadow.camera.bottom = -10
      }
      scene.add(directionalLight)

      // 环境光
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4)
      scene.add(ambientLight)

      // 创建几个测试物体
      const objects = []

      // 立方体
      const boxGeometry = new THREE.BoxGeometry(1, 1, 1)
      const boxMaterial = new THREE.MeshStandardMaterial({ color: 0xff6b6b })
      const box = new THREE.Mesh(boxGeometry, boxMaterial)
      box.position.set(-3, 0.5, -2)
      box.castShadow = enableShadow  // 关键：是否投射阴影
      box.receiveShadow = enableShadow
      scene.add(box)
      objects.push(box)

      // 球体
      const sphereGeometry = new THREE.SphereGeometry(0.8, 32, 32)
      const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0x4ecdc4 })
      const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial)
      sphere.position.set(0, 0.8, 0)
      sphere.castShadow = enableShadow
      sphere.receiveShadow = enableShadow
      scene.add(sphere)
      objects.push(sphere)

      // 圆柱体
      const cylinderGeometry = new THREE.CylinderGeometry(0.6, 0.6, 1.5, 32)
      const cylinderMaterial = new THREE.MeshStandardMaterial({ color: 0xffe66d })
      const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial)
      cylinder.position.set(3, 0.75, 2)
      cylinder.castShadow = enableShadow
      cylinder.receiveShadow = enableShadow
      scene.add(cylinder)
      objects.push(cylinder)

      // 添加网格辅助线
      const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222)
      scene.add(gridHelper)

      // 添加坐标轴
      const axesHelper = new THREE.AxesHelper(5)
      scene.add(axesHelper)

      return { scene, camera, renderer, objects, directionalLight, lightHelper, lightTarget }
    }

    // 创建两个场景
    const scene1 = createScene('canvas-no-shadow', false)
    const scene2 = createScene('canvas-with-shadow', true)
    
    // 光源位置预设
    const lightPositions = {
      top: [0, 15, 0],           // 正上方
      left: [-10, 10, 0],        // 左侧
      right: [10, 10, 0],        // 右侧
      front: [0, 10, 10],        // 前方
      back: [0, 10, -10],        // 后方
      diagonal: [8, 10, 8]       // 斜角（默认）
    }
    
    // 设置光源位置
    window.setLightPosition = function(positionName) {
      const pos = lightPositions[positionName] || lightPositions.diagonal
      
      // 更新两个场景的光源位置
      scene1.directionalLight.position.set(pos[0], pos[1], pos[2])
      scene2.directionalLight.position.set(pos[0], pos[1], pos[2])
      
      // 更新光源辅助器
      scene1.lightHelper.update()
      scene2.lightHelper.update()
      
      // 更新光源目标（让光源始终指向场景中心）
      scene1.lightTarget.position.set(0, 0, 0)
      scene2.lightTarget.position.set(0, 0, 0)
      scene1.lightTarget.updateMatrixWorld()
      scene2.lightTarget.updateMatrixWorld()
      
      // 更新光源辅助器
      scene1.lightHelper.update()
      scene2.lightHelper.update()
    }

    // 动画函数
    function animate() {
      if (!isAnimating) return

      const time = Date.now() * 0.001

      // 旋转物体
      scene1.objects.forEach((obj, index) => {
        obj.rotation.y = time * 0.5 + index * 0.5
        obj.position.y = 0.5 + Math.sin(time * 2 + index) * 0.3
      })

      scene2.objects.forEach((obj, index) => {
        obj.rotation.y = time * 0.5 + index * 0.5
        obj.position.y = 0.5 + Math.sin(time * 2 + index) * 0.3
      })

      // 渲染
      scene1.renderer.render(scene1.scene, scene1.camera)
      scene2.renderer.render(scene2.scene, scene2.camera)

      animationId = requestAnimationFrame(animate)
    }

    // 窗口大小调整
    function handleResize() {
      const width = window.innerWidth / 2
      const height = window.innerHeight

      scene1.camera.aspect = width / height
      scene1.camera.updateProjectionMatrix()
      scene1.renderer.setSize(width, height)

      scene2.camera.aspect = width / height
      scene2.camera.updateProjectionMatrix()
      scene2.renderer.setSize(width, height)
    }

    window.addEventListener('resize', handleResize)

    // 控制函数
    window.toggleAnimation = function() {
      isAnimating = !isAnimating
      if (isAnimating) {
        animate()
      }
    }

    window.resetPosition = function() {
      scene1.objects.forEach((obj, index) => {
        obj.rotation.y = index * 0.5
        obj.position.y = 0.5
      })
      scene2.objects.forEach((obj, index) => {
        obj.rotation.y = index * 0.5
        obj.position.y = 0.5
      })
    }

    // 开始动画
    animate()
  </script>
</body>
</html>
