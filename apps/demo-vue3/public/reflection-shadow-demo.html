<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反射 + 阴影效果演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: #1a1a2e;
      color: #fff;
      overflow: hidden;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      gap: 2px;
      background: #000;
    }
    .demo-panel {
      position: relative;
      background: #1a1a2e;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 8px 15px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      z-index: 10;
    }
    .controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 12px 20px;
      border-radius: 8px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 95%;
      z-index: 10;
      justify-content: center;
    }
    button {
      padding: 6px 12px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.3s;
    }
    button:hover {
      background: #357abd;
    }
    button.active {
      background: #2ecc71;
    }
    .info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      max-width: 280px;
      font-size: 11px;
      line-height: 1.5;
      z-index: 10;
    }
    .info h4 {
      margin-bottom: 5px;
      color: #4a90e2;
      font-size: 12px;
    }
    .info ul {
      margin-left: 15px;
      margin-top: 5px;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }
    .slider-container label {
      font-size: 11px;
      min-width: 70px;
    }
    input[type="range"] {
      flex: 1;
      width: 100px;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }
    .toggle-container label {
      font-size: 11px;
      min-width: 70px;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左上：只有反射，无阴影 -->
    <div class="demo-panel">
      <div class="label">🪞 只有反射</div>
      <canvas id="canvas-reflection-only"></canvas>
      <div class="info">
        <h4>只有反射：</h4>
        <ul>
          <li>物体在地板上反射</li>
          <li>但没有阴影</li>
          <li>物体看起来"漂浮"</li>
        </ul>
      </div>
    </div>

    <!-- 右上：只有阴影，无反射 -->
    <div class="demo-panel">
      <div class="label">🌑 只有阴影</div>
      <canvas id="canvas-shadow-only"></canvas>
      <div class="info">
        <h4>只有阴影：</h4>
        <ul>
          <li>物体有阴影</li>
          <li>但没有反射</li>
          <li>地板看起来不真实</li>
        </ul>
      </div>
    </div>

    <!-- 左下：反射 + 阴影 -->
    <div class="demo-panel">
      <div class="label">✨ 反射 + 阴影</div>
      <canvas id="canvas-both"></canvas>
      <div class="info">
        <h4>反射 + 阴影：</h4>
        <ul>
          <li>物体有反射和阴影</li>
          <li>看起来最真实</li>
          <li>空间感最强</li>
        </ul>
      </div>
    </div>

    <!-- 右下：无反射无阴影 -->
    <div class="demo-panel">
      <div class="label">❌ 无反射无阴影</div>
      <canvas id="canvas-neither"></canvas>
      <div class="info">
        <h4>无反射无阴影：</h4>
        <ul>
          <li>物体看起来"漂浮"</li>
          <li>缺乏真实感</li>
          <li>空间关系不明确</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="toggleAnimation()">暂停/播放</button>
    <button onclick="resetPosition()">重置位置</button>
    
    <div style="margin-left: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <label style="font-size: 11px;">光源位置:</label>
      <button onclick="setLightPosition('top')">上方</button>
      <button onclick="setLightPosition('left')">左侧</button>
      <button onclick="setLightPosition('right')">右侧</button>
      <button onclick="setLightPosition('front')">前方</button>
      <button onclick="setLightPosition('back')">后方</button>
      <button onclick="setLightPosition('diagonal')" class="active">斜角</button>
    </div>
    
    <div class="slider-container">
      <label>光源强度:</label>
      <input type="range" id="intensitySlider" min="0" max="3" step="0.1" value="1" 
             oninput="updateIntensity(this.value)">
      <span id="intensityValue">1.0</span>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three'
    import { Reflector } from 'three/addons/objects/Reflector.js'

    let animationId = null
    let isAnimating = true
    let currentIntensity = 1.0

    // 创建场景的通用函数
    function createScene(canvasId, config) {
      const { enableReflection, enableShadow } = config
      const canvas = document.getElementById(canvasId)
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x1a1a2e)

      // 相机
      const camera = new THREE.PerspectiveCamera(
        50,
        canvas.clientWidth / canvas.clientHeight,
        0.1,
        1000
      )
      camera.position.set(8, 6, 8)
      camera.lookAt(0, 0, 0)

      // 渲染器
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
      renderer.setSize(canvas.clientWidth, canvas.clientHeight)
      renderer.shadowMap.enabled = enableShadow
      renderer.shadowMap.type = THREE.PCFSoftShadowMap

      // 方向光（增强强度，让阴影更明显）
      const directionalLight = new THREE.DirectionalLight(0xffffff, enableShadow ? 1.5 : 1.0)
      directionalLight.position.set(8, 10, 8)
      directionalLight.castShadow = enableShadow
      if (enableShadow) {
        directionalLight.shadow.mapSize.width = 2048
        directionalLight.shadow.mapSize.height = 2048
        directionalLight.shadow.camera.near = 0.5
        directionalLight.shadow.camera.far = 50
        directionalLight.shadow.camera.left = -10
        directionalLight.shadow.camera.right = 10
        directionalLight.shadow.camera.top = 10
        directionalLight.shadow.camera.bottom = -10
        // 增强阴影对比度
        directionalLight.shadow.bias = -0.0001
        directionalLight.shadow.normalBias = 0.02
      }
      
      // 设置光源目标
      const lightTarget = new THREE.Object3D()
      lightTarget.position.set(0, 0, 0)
      directionalLight.target = lightTarget
      scene.add(lightTarget)
      
      // 光源辅助器
      const lightHelper = new THREE.DirectionalLightHelper(directionalLight, 2)
      lightHelper.visible = true
      scene.add(lightHelper)
      scene.add(directionalLight)

      // 环境光（降低强度，让阴影更明显）
      const ambientLight = new THREE.AmbientLight(0xffffff, enableShadow ? 0.2 : 0.4)
      scene.add(ambientLight)

      // 创建地板
      const floorGeometry = new THREE.PlaneGeometry(20, 20)
      
      // 根据配置决定使用 Reflector 还是普通材质
      const floorGroup = new THREE.Group()
      
      if (enableReflection) {
        // 使用反射地板
        const reflector = new Reflector(floorGeometry, {
          color: 0x52c5ff,
          textureWidth: 1024,
          textureHeight: 1024,
          clipBias: 0.0005,
          multisample: 4
        })
        reflector.rotation.x = -Math.PI / 2
        reflector.position.y = 0
        reflector.receiveShadow = false  // Reflector 本身不接收阴影
        floorGroup.add(reflector)
        
        // 如果有阴影，添加一个半透明的阴影接收层
        if (enableShadow) {
          const shadowLayer = new THREE.Mesh(
            floorGeometry.clone(),
            new THREE.MeshStandardMaterial({
              color: 0x000000,
              transparent: true,
              opacity: 0.3,  // 半透明，让阴影可见
              roughness: 1.0,
              metalness: 0.0
            })
          )
          shadowLayer.rotation.x = -Math.PI / 2
          shadowLayer.position.y = 0.001  // 稍微抬高，避免 z-fighting
          shadowLayer.receiveShadow = true  // 这个层接收阴影
          floorGroup.add(shadowLayer)
        }
      } else {
        // 使用普通材质地板
        const floorMaterial = new THREE.MeshStandardMaterial({
          color: 0x2a2a4a,
          roughness: 0.8,
          metalness: 0.1
        })
        const floor = new THREE.Mesh(floorGeometry, floorMaterial)
        floor.rotation.x = -Math.PI / 2
        floor.position.y = 0
        floor.receiveShadow = enableShadow
        floorGroup.add(floor)
      }
      scene.add(floorGroup)

      // 创建测试物体
      const objects = []

      // 立方体
      const boxGeometry = new THREE.BoxGeometry(1, 1, 1)
      const boxMaterial = new THREE.MeshStandardMaterial({ color: 0xff6b6b })
      const box = new THREE.Mesh(boxGeometry, boxMaterial)
      box.position.set(-3, 0.5, -2)
      box.castShadow = enableShadow
      box.receiveShadow = enableShadow
      scene.add(box)
      objects.push(box)

      // 球体
      const sphereGeometry = new THREE.SphereGeometry(0.8, 32, 32)
      const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0x4ecdc4 })
      const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial)
      sphere.position.set(0, 0.8, 0)
      sphere.castShadow = enableShadow
      sphere.receiveShadow = enableShadow
      scene.add(sphere)
      objects.push(sphere)

      // 圆柱体
      const cylinderGeometry = new THREE.CylinderGeometry(0.6, 0.6, 1.5, 32)
      const cylinderMaterial = new THREE.MeshStandardMaterial({ color: 0xffe66d })
      const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial)
      cylinder.position.set(3, 0.75, 2)
      cylinder.castShadow = enableShadow
      cylinder.receiveShadow = enableShadow
      scene.add(cylinder)
      objects.push(cylinder)

      // 添加网格辅助线
      const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222)
      scene.add(gridHelper)

      return { 
        scene, 
        camera, 
        renderer, 
        objects, 
        directionalLight, 
        ambientLight, 
        lightHelper, 
        lightTarget 
      }
    }

    // 创建四个场景
    const scene1 = createScene('canvas-reflection-only', {
      enableReflection: true,
      enableShadow: false
    })

    const scene2 = createScene('canvas-shadow-only', {
      enableReflection: false,
      enableShadow: true
    })

    const scene3 = createScene('canvas-both', {
      enableReflection: true,
      enableShadow: true
    })

    const scene4 = createScene('canvas-neither', {
      enableReflection: false,
      enableShadow: false
    })

    const scenes = [scene1, scene2, scene3, scene4]

    // 光源位置预设
    const lightPositions = {
      top: [0, 15, 0],
      left: [-10, 10, 0],
      right: [10, 10, 0],
      front: [0, 10, 10],
      back: [0, 10, -10],
      diagonal: [8, 10, 8]
    }

    // 动画函数
    function animate() {
      if (!isAnimating) return

      const time = Date.now() * 0.001

      scenes.forEach(scene => {
        scene.objects.forEach((obj, index) => {
          obj.rotation.y = time * 0.5 + index * 0.5
          obj.position.y = 0.5 + Math.sin(time * 2 + index) * 0.3
        })
        scene.renderer.render(scene.scene, scene.camera)
      })

      animationId = requestAnimationFrame(animate)
    }

    // 窗口大小调整
    function handleResize() {
      const width = window.innerWidth / 2
      const height = window.innerHeight / 2

      scenes.forEach(scene => {
        scene.camera.aspect = width / height
        scene.camera.updateProjectionMatrix()
        scene.renderer.setSize(width, height)
      })
    }

    window.addEventListener('resize', handleResize)

    // 控制函数
    window.toggleAnimation = function() {
      isAnimating = !isAnimating
      if (isAnimating) {
        animate()
      }
    }

    window.resetPosition = function() {
      scenes.forEach(scene => {
        scene.objects.forEach((obj, index) => {
          obj.rotation.y = index * 0.5
          obj.position.y = 0.5
        })
      })
    }

    window.setLightPosition = function(positionName) {
      const pos = lightPositions[positionName] || lightPositions.diagonal
      
      // 更新所有场景的光源位置
      scenes.forEach(scene => {
        scene.directionalLight.position.set(pos[0], pos[1], pos[2])
        scene.lightTarget.position.set(0, 0, 0)
        scene.lightTarget.updateMatrixWorld()
        scene.lightHelper.update()
      })
      
      // 更新按钮状态
      document.querySelectorAll('.controls button').forEach(btn => {
        btn.classList.remove('active')
      })
      event.target.classList.add('active')
    }

    window.updateIntensity = function(value) {
      currentIntensity = parseFloat(value)
      document.getElementById('intensityValue').textContent = currentIntensity.toFixed(1)
      
      scenes.forEach(scene => {
        scene.directionalLight.intensity = currentIntensity
        scene.ambientLight.intensity = currentIntensity * 0.4
      })
    }

    // 开始动画
    animate()
  </script>
</body>
</html>
